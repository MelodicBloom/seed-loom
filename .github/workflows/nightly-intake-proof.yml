name: Nightly Intake Proof (Issue #24)

on:
  pull_request:
    paths:
      - 'knowledge/intake/nightly/**/nightly-run-bundle*.json'
      - 'scripts/knowledge/prove-nightly-ingest.mjs'
      - 'scripts/knowledge/ingest-nightly-run.mjs'
      - 'scripts/knowledge/normalize-nightly-bundle.mjs'
      - 'scripts/knowledge/run-controls.mjs'
      - 'scripts/knowledge/build-workbench.mjs'
      - 'knowledge/schema/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/nightly-intake-proof.yml'
  workflow_dispatch:
    inputs:
      bundle:
        description: "Reviewed NightlyRunBundle repository path"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-intake-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact proof branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate selected bundle path
        if: ${{ inputs.bundle != '' }}
        env:
          PROOF_BUNDLE: ${{ inputs.bundle }}
        run: |
          case "$PROOF_BUNDLE" in
            knowledge/intake/nightly/*.json) ;;
            *) echo "::error::bundle must be a JSON file under knowledge/intake/nightly/"; exit 1 ;;
          esac
          case "$PROOF_BUNDLE" in
            *..*|*//*|*' '*) echo "::error::bundle path must be a plain repository path"; exit 1 ;;
          esac
          if ! git ls-files --error-unmatch -- "$PROOF_BUNDLE" >/dev/null 2>&1; then
            echo "::error::bundle is not a tracked file on this ref: $PROOF_BUNDLE"; exit 1
          fi
          if [ -L "$PROOF_BUNDLE" ] || [ ! -f "$PROOF_BUNDLE" ]; then
            echo "::error::bundle must be a regular file"; exit 1
          fi
          sha256sum -- "$PROOF_BUNDLE"

      - name: Prove one real reviewed NightlyRunBundle twice
        env:
          PROOF_BUNDLE: ${{ inputs.bundle }}
        run: |
          if [ -n "$PROOF_BUNDLE" ]; then
            node scripts/knowledge/prove-nightly-ingest.mjs \
              "$PROOF_BUNDLE" --out=nightly-intake-proof.json
          else
            npm run knowledge:prove-nightly -- --out=nightly-intake-proof.json
          fi

      - name: Upload machine-readable proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-24-nightly-intake-proof
          path: nightly-intake-proof.json
          if-no-files-found: error
          retention-days: 14
