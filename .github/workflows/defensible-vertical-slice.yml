name: Defensible Vertical Slice
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: MelodicBloom/.github/.github/workflows/reusable-defensible-vertical-slice.yml@c6e9f3b30e8ba11ce6fc11c2c5f6a510cabf5e4b
    with:
      node-version: "20"
      package-manager: npm
      profile-path: .melodicbloom/verification-profile.json
      typecheck-command: npm run typecheck
      test-command: npx playwright install --with-deps chromium && npm run test:visual
      build-command: npm run build
      specialized-command: test -d schemas && find schemas -type f -name '*.json' -print0 | xargs -0 -n1 node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))"
      artifact-path: dist
